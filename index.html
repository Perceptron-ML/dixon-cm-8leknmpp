<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <img class="brand-full" src="assets/logo.png" alt="The Dixon Injury Firm">
      <img class="brand-mark" src="assets/logo-mark.png" alt="The Dixon Injury Firm">
      <span class="brand-sub">Case Manager</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="side-toggle" id="sideToggle" title="Switch between the staff app and the client portal">
        <button class="vt-seg active" data-vt="staff">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>

      <div class="user-chip">
        <div class="avatar">CD</div>
        <div>
          <div class="user-name">Chris Dixon</div>
          <div class="user-role">Managing Attorney</div>
        </div>
      </div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="search" id="searchWrap">
        <span class="search-icon" id="searchIcon"></span>
        <input id="globalSearch" type="text" placeholder="Search cases, contacts, and documents" autocomplete="off">
        <div class="search-results" id="searchResults"></div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="notifBtn" title="Notifications"></button>
